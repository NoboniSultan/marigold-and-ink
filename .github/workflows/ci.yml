name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    # This name is the status check that branch protection requires before merging to main.
    name: 'Server: lint, migrate, test'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # A throwaway Postgres for this run, same major version as local and production.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marigold
          POSTGRES_PASSWORD: marigold
          POSTGRES_DB: marigold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marigold -d marigold_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Values for CI only. None of them are secrets: the database is discarded after the run.
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://marigold:marigold@localhost:5432/marigold_test
      AUTH_SECRET: ci-only-placeholder-not-a-real-secret-0000
      CORS_ORIGINS: http://localhost:5173
      # Test-only business values; the real ones are set in render.yaml / .env.
      DEPOSIT_PERCENT: '40'
      COMMISSION_REVISION_LIMIT: '2'

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Node runs .ts files by stripping types without checking them, so this is the
      # step that actually enforces the types.
      - name: Type check
        run: npm run typecheck

      - name: Run migrations
        run: npm run migrate:up

      - name: Test with coverage
        run: npm run test:coverage

      # What Render does on start, under plain Node (tests compile TypeScript through Vitest,
      # so this is what proves Node's own type stripping runs the code). The seed reads the
      # real content/ and media/, so a content file that doesn't match its images fails here.
      - name: Seed and boot as in production
        run: |
          npm run seed
          PORT=3999 node src/server.js &
          for i in $(seq 1 30); do curl -fs localhost:3999/api/v1/health > /dev/null && break; sleep 0.5; done
          curl -fsS localhost:3999/api/v1/health
          curl -fsS "localhost:3999/api/v1/artworks?pageSize=1" > /dev/null
          curl -fsS localhost:3999/api/v1/about > /dev/null

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: server/coverage/
          retention-days: 14

  client:
    # Also a required status check for merging to main.
    name: 'Client: lint, typecheck, test, build'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The same build Render runs; fails on type errors too (`tsc --noEmit && vite build`).
      - name: Build
        run: npm run build
