# Render Blueprint: the production infrastructure, reviewed in PRs like code.
# Create it once in the Render Dashboard (New > Blueprint > this repo). Render then keeps
# the services in sync with this file.
#
# Secrets are never in this file: `generateValue` creates one on Render, and `sync: false`
# makes Render ask for the value when the Blueprint is first created.

services:
  - type: web
    name: marigold-and-ink-api
    runtime: node
    plan: free # spins down after 15 min idle; first request after that is slow
    region: oregon
    branch: main
    # Deploy only after GitHub Actions CI passes on main, so a failing commit never ships.
    autoDeployTrigger: checksPass
    # No rootDir: Render hides files outside a service's root directory, and the server
    # reads content/ and media/ at the repo root (and will build client/ in milestone 5b).
    # Commands therefore `cd server` themselves.
    # Build the React site first (Express serves client/dist). NODE_ENV=production makes a
    # plain `npm ci` skip devDependencies, and Vite and TypeScript are devDependencies, so
    # the client install includes them; the server install keeps runtime packages only.
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    # Free instances don't support preDeployCommand, so migrations and the (idempotent)
    # seed run before the server starts. If either fails (a broken migration, or a content
    # file that doesn't match its images), the new instance never becomes healthy and Render
    # keeps serving the previous deploy.
    # On a paid plan, move `npm run migrate:up && npm run seed` to preDeployCommand.
    startCommand: cd server && npm run migrate:up && npm run seed && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION # keep in sync with .nvmrc
        value: 26.13.1
      - key: TRUST_PROXY # Render's load balancer is one proxy hop
        value: '1'
      # Postgres is hosted on Neon (ADR 0006). Paste Neon's DIRECT connection string
      # (pooling off: the host must not contain "-pooler"), with sslmode=verify-full.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Browser origins allowed to send state-changing requests (comma-separated). The site
      # is served by this same service, so this is the service's own URL (or the custom
      # domain, once there is one). The CSRF origin check rejects anything else.
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Business settings, not secrets. ⚠️ PLACEHOLDERS until the owner sets real values.
      - key: DEPOSIT_PERCENT
        value: '50'
      - key: COMMISSION_REVISION_LIMIT
        value: '2'
# No `databases:` section: the database lives on Neon, not Render (ADR 0006).
