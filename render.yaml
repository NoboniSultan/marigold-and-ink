# Render Blueprint: the production infrastructure, reviewed in PRs like code.
# Create it once in the Render Dashboard (New > Blueprint > this repo). Render then keeps
# the services in sync with this file.
#
# Secrets are never in this file: `generateValue` creates one on Render, and `sync: false`
# makes Render ask for the value when the Blueprint is first created.

services:
  - type: web
    name: marigold-and-ink-api
    runtime: node
    plan: free # spins down after 15 min idle; first request after that is slow
    region: oregon
    branch: main
    # Deploy only after GitHub Actions CI passes on main, so a failing commit never ships.
    autoDeployTrigger: checksPass
    # No rootDir: Render hides files outside a service's root directory, and the server
    # reads content/ and media/ at the repo root (and will build client/ in milestone 5b).
    # Commands therefore `cd server` themselves.
    # Build the React site first (Express serves client/dist). NODE_ENV=production makes a
    # plain `npm ci` skip devDependencies, and Vite and TypeScript are devDependencies, so
    # the client install includes them; the server install keeps runtime packages only.
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    # Free instances don't support preDeployCommand, so migrations and the (idempotent)
    # seed run before the server starts. If either fails (a broken migration, or a content
    # file that doesn't match its images), the new instance never becomes healthy and Render
    # keeps serving the previous deploy.
    # On a paid plan, move `npm run migrate:up && npm run seed` to preDeployCommand.
    startCommand: cd server && npm run migrate:up && npm run seed && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION # keep in sync with .nvmrc
        value: 26.13.1
      - key: TRUST_PROXY # Render's load balancer is one proxy hop
        value: '1'
      # The shop: leave unset (closed, admin-only preview) until it should open; then 'true'.
      - key: SHOP_OPEN
        sync: false
      # Postgres is hosted on Neon (ADR 0006). Paste Neon's DIRECT connection string
      # (pooling off: the host must not contain "-pooler"), with sslmode=verify-full.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Browser origins allowed to send state-changing requests: one variable, comma-separated,
      # no spaces needed. The site is served by this same service, so this is the custom
      # domain plus the onrender.com address (a tab opened there before the redirect can
      # still submit). Set in the Dashboard: https://noboni.art,https://marigold-and-ink-api.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Accounts (docs/setup-google-and-email.md). Optional: each feature stays off until its
      # values are set in the Dashboard. Render only asks for sync: false values when a
      # Blueprint is first created, so on this existing service add them in the Dashboard.
      # The site's one public address. In production, page requests on any other address
      # (onrender.com, www.) redirect here (middleware/canonicalHost.ts), because Google
      # sign-in and the session cookie only work on this host.
      - key: PUBLIC_URL
        value: https://noboni.art
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Set EMAIL_TRANSPORT=resend once a domain is verified in Resend. Until then email
      # sign-up shows "opens soon" (codes are never written to production logs).
      - key: EMAIL_TRANSPORT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Stripe payments, test mode only (sk_test_ keys; live keys are refused). Off until
      # both secrets are set in the Dashboard; the webhook secret comes from the Dashboard
      # endpoint for <PUBLIC_URL>/api/v1/webhooks/stripe.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_CURRENCY
        value: usd
      # Business settings, not secrets. ⚠️ PLACEHOLDERS until the owner sets real values.
      - key: DEPOSIT_PERCENT
        value: '50'
      - key: COMMISSION_REVISION_LIMIT
        value: '2'
      # Giving (docs/setup-digital-humani.md): trees through Digital Humani when a commission
      # is fully paid. Off until the API key is set. 'production' is refused while Stripe is
      # test-only (it would plant real trees with no real income behind them).
      - key: DIGITALHUMANI_API_KEY
        sync: false
      - key: DIGITALHUMANI_ENTERPRISE_ID
        sync: false
      - key: DIGITALHUMANI_PROJECT_ID
        sync: false
      - key: DIGITALHUMANI_ENVIRONMENT
        value: sandbox
      # The owner's promise: 25% of every commission's full price goes to trees.
      - key: DONATION_PERCENT
        value: '25'
      # Files (milestone 10): reference photos, previews, and final files in a private
      # Cloudflare R2 bucket. Off until all four are set (docs/setup-r2.md).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Shipping (Shippo). Off until all are set (docs/setup-shippo.md); STREET2 optional.
      # EMAIL and PHONE are needed for labels; the webhook token for tracking updates.
      - key: SHIPPO_API_KEY
        sync: false
      - key: PACKAGING_FEE_CENTS
        sync: false
      - key: SHIP_FROM_NAME
        sync: false
      - key: SHIP_FROM_STREET1
        sync: false
      - key: SHIP_FROM_STREET2
        sync: false
      - key: SHIP_FROM_CITY
        sync: false
      - key: SHIP_FROM_STATE
        sync: false
      - key: SHIP_FROM_ZIP
        sync: false
      - key: SHIP_FROM_EMAIL
        sync: false
      - key: SHIP_FROM_PHONE
        sync: false
      - key: SHIPPO_WEBHOOK_TOKEN
        sync: false
# No `databases:` section: the database lives on Neon, not Render (ADR 0006).
